name: SnackMachine Smoke

on:
  workflow_dispatch:
    inputs:
      ucore_url:
        description: "uCore backend base URL"
        required: false
        default: "http://127.0.0.1:8484"
        type: string
      frontend_url:
        description: "uCore frontend base URL"
        required: false
        default: "http://localhost:5175"
        type: string
      snackmachine_path:
        description: "Absolute path to SnackMachine checkout on runner"
        required: false
        default: "$HOME/Code/SnackMachine"
        type: string

jobs:
  smoke:
    name: Run SnackMachine Integration Smoke
    runs-on: self-hosted

    steps:
      - name: Checkout uCore
        uses: actions/checkout@v4

      - name: Prepare smoke environment
        run: |
          echo "UCORE_URL=${{ inputs.ucore_url }}" >> "$GITHUB_ENV"
          echo "FRONTEND_URL=${{ inputs.frontend_url }}" >> "$GITHUB_ENV"
          echo "UCORE_SNACKMACHINE_PATH=${{ inputs.snackmachine_path }}" >> "$GITHUB_ENV"

      - name: Validate SnackMachine contract
        run: python3 scripts/check_snackmachine_contract.py

      - name: Run integration smoke
        run: bash scripts/smoke_snackmachine_integration.sh
