# uCore Service Registry Configuration
# Copy to $UDOS_HOME/config/service-registry.yaml and adjust.
#
# Purpose:
# - Single source of truth for service definitions used by:
#   - backend/app/surfaces/server.py
#   - backend/app/surfaces/system_api.py
#
# Notes:
# - health.path is joined with the host/port unless health.absolute_url is set.
# - probe.timeout_seconds and probe.accept_status apply to all services unless overridden.

version: 1

probe:
  timeout_seconds: 2
  accept_status: [200]

services:
  - id: snackbar
    name: Snackbar
    category: system
    host: localhost
    port: 8484
    health:
      path: /api/health
    description: Container orchestrator and workflow runner

  - id: hivemind
    name: Hivemind
    category: system
    host: localhost
    port: 8490
    health:
      path: /health
    description: AI agent routing gateway

  - id: vault-mcp
    name: Vault MCP
    category: user
    host: localhost
    port: 8765
    health:
      path: /health
    description: Vault MCP bridge

  - id: ollama
    name: Ollama
    category: system
    host: localhost
    port: 11434
    health:
      path: /api/tags
      accept_status: [200]
    description: Local LLM inference runtime

# Feed spool and secret storage are embedded Snackbar capabilities, not
# independently managed network services. Register only real daemons here.
