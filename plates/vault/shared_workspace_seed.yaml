plate:
  id: "vault.shared_workspace_seed"
  version: "2.0.0"
  domain: "vault"
  description: "Seed structure for shared team vaults at ~/Shared/"
  vault_layer: "shared"
  vault_path: "~/Shared/"
  structure:
    - path: "{workspace_name}/"
      description: "Workspace root"
    - path: "{workspace_name}/binders/active/"
      description: "Shared project binders"
    - path: "{workspace_name}/orbs/"
      description: "Shared knowledge orbs"
    - path: "{workspace_name}/people/"
      description: "Shared contact records"
    - path: "{workspace_name}/tasks/"
      description: "Shared task records"
    - path: "{workspace_name}/@inbox/pending/"
      description: "Submissions awaiting review"
    - path: "{workspace_name}/@inbox/approved/"
      description: "Approved submissions"
    - path: "{workspace_name}/@inbox/rejected/"
      description: "Declined submissions"
    - path: "{workspace_name}/@public/"
      description: "Material prepared for public access"
    - path: "{workspace_name}/@teams/"
      description: "Team collections"
    - path: "{workspace_name}/_invites/"
      description: "Workspace invitations"
    - path: "{workspace_name}/#skills/"
      description: "Shared skill references"
  seed_files:
    - path: "{workspace_name}/README.md"
      content: |
        # Shared workspace

        Use this workspace for material you intend to share. Keep private drafts
        in your User Vault. Review incoming submissions in `@inbox/pending/`
        and record the outcome under `approved/` or `rejected/` in the inbox.
        Keep shared project material in `binders/active/`, knowledge in `orbs/`,
        and shared people and tasks in their corresponding folders.
  source: "builtin"
  checksum: ""
  dependencies: []
  lessons:
    - "Shared vaults are team-oriented, not personal"
    - "Each workspace gets its own subdirectory under ~/Shared/"
    - "Archive old workspaces rather than deleting them"
  destroy:
    salvage_keys:
      - vault_layer
      - vault_path
      - workspace_name
    rebuild_command: "echo Rebuilding shared workspace $workspace_name at $vault_path"
    backup_before_destroy: true
    spool_archive:
      enabled: true
      spool_dir: "${UDOS_HOME}/logs"
      compress_metadata: true
      include_source: false
      include_lessons: true
      max_spool_age_days: 365
