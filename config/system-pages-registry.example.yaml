# uCore System Pages Registry Configuration
# Copy to ~/.ucore/config/system-pages-registry.yaml and adjust.
#
# Purpose:
# - External registry for System Surface S-page menus.
# - Replaces hardcoded S_PAGES fallback array.

version: 1

pages:
  s:
    - id: S100
      title: Page Not Found
      icon: search_off
    - id: S101
      title: Server Offline
      icon: cloud_off
    - id: S300
      title: Internal Server Error
      icon: error
    - id: S310
      title: Request Timed Out
      icon: timer_off
    - id: S320
      title: Access Restricted
      icon: lock
    - id: S330
      title: Configuration Missing
      icon: settings
    - id: S340
      title: Dependency Unavailable
      icon: link_off
    - id: S600
      title: Help and Recovery
      icon: help

validation:
  required_fields: [id, title, icon]
  id_patterns:
    s: ^S[0-9]{3}$
