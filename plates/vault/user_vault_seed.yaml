plate:
  id: "vault.user_vault_seed"
  version: "3.0.0"
  domain: "vault"
  description: "Sandbox and Memory starter for a new User Vault"
  vault_layer: "user"
  vault_path: "~/Vault/"
  structure:
    - path: "Sandbox/"
      description: "Permanent workspace for drafts and experiments"
    - path: "Memory/"
      description: "Durable documents managed by uDOS"

  seed_files:
    - path: "Sandbox/README.md"
      content: |
        # Welcome to your User Vault

        - Sandbox is your permanent folder for drafts and experiments.
        - Create a Binder in Workflow when a project needs its own documents,
          tasks, and references. Each Binder has its own folder at the Vault root.
        - Memory holds saved captures, reference notes, exports, and records
          managed by uDOS. Its subfolders are created as needed.
        - Save documents inside Sandbox, a Binder, or Memory.
        - Use GridCore uCode1 and Spatial uCode2 for the two uCode pathways.

    - path: "Memory/README.md"
      content: |
        # Memory

        This folder holds durable material you may want to revisit. Intake,
        Activity, Reference, Workflow, Personal, Files, and Exports are
        created when their owning surface needs them. Active service state
        lives under the configured uDOS runtime home.

  source: "builtin"
  checksum: ""
  dependencies: []
  lessons:
    - "New seed layouts do not migrate or delete existing user files"
    - "uFlow owns tasks and schedules; configured runtime state belongs under UDOS_HOME"
    - "Retained intake originals remain inspectable on disk"
  destroy:
    salvage_keys:
      - vault_layer
      - vault_path
    rebuild_command: "python -m plate_refresh.refresh --render vault.user_vault_seed"
    backup_before_destroy: true
    spool_archive:
      enabled: true
      spool_dir: "${UDOS_HOME}/logs"
      compress_metadata: true
      include_source: false
      include_lessons: true
      max_spool_age_days: 365
