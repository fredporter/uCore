# Bidirectional vault sync configuration for uCore.
# Copy to config/vault-sync.yaml and adjust paths as needed.

state_file: ~/.ucore/vault-sync-state.json

# Vault topology — 3 vault types only (see docs/VAULT_BINDER_WORKFLOW_INTEGRATION.md):
#   user   → ~/Vault/      (personal vault — single source of truth)
#   shared → ~/Shared/     (collaborative vaults for teams)
#   public → ~/Public/     (published, system-provided, community vaults)
#
# Note: ~/Code/ is NOT a vault — it is the Developer Lane codebase.

containers:
  - id: user-vault
    left: /Users/fredbook/Vault
    right: /Users/fredbook/Code/uDocs/ingest/user-vault
    mode: bidirectional
    include:
      - "**/*.md"
      - "**/*.markdown"

  - id: shared-vault
    left: /Users/fredbook/Shared
    right: /Users/fredbook/Code/uDocs/ingest/shared
    mode: bidirectional
    include:
      - "**/*.md"
      - "**/*.markdown"

  - id: global-knowledge
    left: /Users/fredbook/Public
    right: /Users/fredbook/Code/uDocs/ingest/public
    mode: bidirectional
    include:
      - "**/*.md"
      - "**/*.markdown"
