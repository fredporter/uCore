# uCore System Pages Registry Configuration
# Copy to ~/.ucore/config/system-pages-registry.yaml and adjust.
#
# Purpose:
# - External registry for System Surface S/P page menus.
# - Replaces hardcoded S_PAGES and P_PAGES arrays.

version: 1

pages:
  s:
    - id: S100
      title: Tool Builder
      icon: build
    - id: S101
      title: Story Builder
      icon: auto_stories
    - id: S300
      title: Workflow Builder
      icon: account_tree
    - id: S310
      title: Clipboard Orchestration
      icon: content_paste
    - id: S320
      title: Knowledge Tools
      icon: psychology
    - id: S330
      title: Migration Dashboard
      icon: migration
    - id: S600
      title: Learning Hub
      icon: school

  p:
    - id: P001
      title: System Health
      icon: monitor_heart
    - id: P002
      title: Configuration Audit
      icon: checklist
    - id: P003
      title: Service Graph
      icon: bubble_chart
    - id: P004
      title: Secret Audit Trail
      icon: security
    - id: P005
      title: Variable Inspector
      icon: data_object

validation:
  required_fields: [id, title, icon]
  id_patterns:
    s: ^S[0-9]{3}$
    p: ^P[0-9]{3}$
