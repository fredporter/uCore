# uCore System Pages Registry Configuration
# Copy to ~/.ucore/config/system-pages-registry.yaml and adjust.
#
# Purpose:
# - External registry for System Surface S-page menus.
# - Replaces hardcoded S_PAGES fallback array.

version: 1

pages:
  s:
    - id: S100
      title: Tool Builder
      icon: build
    - id: S101
      title: Story Builder
      icon: auto_stories
    - id: S300
      title: Workflow Builder
      icon: account_tree
    - id: S340
      title: Operations Console
      icon: tune
    - id: S310
      title: Clipboard Orchestration
      icon: content_paste
    - id: S320
      title: Knowledge Tools
      icon: psychology
    - id: S330
      title: Migration Dashboard
      icon: migration
    - id: S600
      title: Learning Hub
      icon: school

validation:
  required_fields: [id, title, icon]
  id_patterns:
    s: ^S[0-9]{3}$
