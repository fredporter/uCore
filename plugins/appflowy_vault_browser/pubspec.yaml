name: vault_browser_plugin
description: AppFlowy plugin — vault workspace switcher and All Docs browser. Browse and switch between User, Shared, and Public vault workspaces with a full-text searchable document list.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true