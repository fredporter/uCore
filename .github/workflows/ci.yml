name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  planning-governance:
    name: Planning Governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate planning governance
        run: bash scripts/validate_planning_governance.sh

      - name: Validate capability requirements coverage
        run: python3 scripts/validate_capability_requirements.py

      - name: Validate docs non-regression
        run: python3 scripts/validate_docs_nonregression.py

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run backend tests
        run: pytest -q

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate prose class standard
        run: pnpm run check:prose-standard

      - name: Build frontend
        run: pnpm run build
