name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  planning-governance:
    name: Planning Governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install governance probe dependencies
        run: python -m pip install aiohttp pyyaml

      - name: Validate planning governance
        run: bash scripts/validate_planning_governance.sh

      - name: Reject new home-root state paths (pull request)
        if: github.event_name == 'pull_request'
        run: git diff --unified=0 "origin/${{ github.base_ref }}...HEAD" | python3 scripts/check_home_path_policy.py --diff-stdin

      - name: Reject new home-root state paths (push)
        if: github.event_name == 'push'
        run: git diff --unified=0 "${{ github.event.before }}..${{ github.sha }}" | python3 scripts/check_home_path_policy.py --diff-stdin

      - name: Validate capability requirements coverage
        run: python3 scripts/validate_capability_requirements.py

      - name: Validate docs non-regression
        run: python3 scripts/validate_docs_nonregression.py

      - name: Validate documentation route contract
        run: PYTHONPATH=backend python3 scripts/check_documentation_route_contract.py

      - name: Validate extension manifests
        run: python3 scripts/validate_extension_manifests.py

      - name: Audit duplicate API routes
        run: python3 scripts/audit_duplicate_routes.py

      - name: Validate legacy settings and removed-module cleanup
        run: python3 scripts/validate_legacy_settings_cleanup.py


  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UDOS_ROOT: ${{ github.workspace }}/..
      UDOS_HOME: ${{ github.workspace }}/.ci-udos
      UCORE_UCODE_PATH: ${{ github.workspace }}/external/uCode
      UCORE_DATA_DIR: ${{ github.workspace }}/.ci-udos/data
      UDOS_VAULT_ROOT: ${{ github.workspace }}/.ci-udos/Vault
      UDOS_SHARED_ROOT: ${{ github.workspace }}/.ci-udos/Shared
      UDOS_PUBLIC_ROOT: ${{ github.workspace }}/.ci-udos/Public
      UFLOW_TASKS_DIR: ${{ github.workspace }}/.ci-udos/flow/tasks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout uCode runtime
        uses: actions/checkout@v4
        with:
          repository: fredporter/uCode
          # Native BASIC lifecycle contract; publish/review this companion commit
          # before running remote CI for this checkpoint.
          ref: f794d8e7144e69d076c6f6b9d4d76c53b07852e2
          path: external/uCode

      - name: Install locked backend dependencies
        run: |
          python -m pip install uv==0.11.8
          UV_PROJECT_ENVIRONMENT="$GITHUB_WORKSPACE/backend/.venv" uv --no-cache sync --project backend --locked --extra dev
          backend/.venv/bin/python scripts/check_backend_environment.py

      - name: Prepare isolated runtime and Git identity
        run: |
          mkdir -p "$UDOS_HOME/data"
          git config --global user.name "uCore CI"
          git config --global user.email "ci@udos.invalid"

      - name: Smoke split-repo imports and extension routes
        run: backend/.venv/bin/python scripts/smoke_split_repo_imports.py

      - name: Validate split-repo packaging layout
        run: backend/.venv/bin/python scripts/validate_split_repo_packaging.py

      - name: Run backend tests
        run: backend/.venv/bin/python -m pytest -q backend/tests

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Checkout uCode
        uses: actions/checkout@v4
        with:
          repository: fredporter/uCode
          # Must match the backend runtime checkout above.
          ref: f794d8e7144e69d076c6f6b9d4d76c53b07852e2
          path: external/uCode

      - name: Expose sibling uCode source contract
        run: ln -s "$GITHUB_WORKSPACE/external/uCode" "$GITHUB_WORKSPACE/../uCode"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --dir frontend-vue run build

      - name: Test frontend
        run: pnpm --dir frontend-vue run test -- --run
